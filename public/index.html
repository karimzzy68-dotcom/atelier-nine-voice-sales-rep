<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atelier Nine · Personal Stylist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">IX</span><span id="store-name">Atelier Nine</span></div>
    <button class="bag-button" id="bag-button" aria-label="Open bag">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span id="bag-count">0</span>
    </button>
  </header>

  <main class="stage">
    <section class="hero" id="hero">
      <div class="orb-wrap">
        <canvas id="orb" width="520" height="520" aria-hidden="true"></canvas>
        <div class="status-pill" id="status">Ready when you are</div>
      </div>
      <h1 id="headline">Your <em>personal</em> stylist, one conversation away</h1>
      <p class="sub" id="subline">Tell <span class="rep-name">Mara</span> what you're shopping for. She'll find it, style it, and bag it for you.</p>

      <div class="captions" id="captions" aria-live="polite"></div>

      <div class="controls">
        <button class="primary" id="start">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span>Talk to <span class="rep-name">Mara</span></span>
        </button>
        <button class="ghost hidden" id="mute" aria-pressed="false">Mute mic</button>
        <button class="ghost hidden" id="end">End</button>
      </div>

      <form class="typebar hidden" id="typebar" autocomplete="off">
        <input id="typed" placeholder="Or type a message…" aria-label="Type a message" />
        <button type="submit" aria-label="Send">→</button>
      </form>
      <p class="error hidden" id="error"></p>
    </section>

    <section class="picks hidden" id="picks">
      <h2 id="picks-title">Picked for you</h2>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Your bag</h2>
      <button class="icon" id="close-drawer" aria-label="Close bag">×</button>
    </div>
    <div id="bag-items"></div>
    <div class="bag-foot">
      <div class="ship-meter"><div id="ship-fill"></div></div>
      <p id="ship-note"></p>
      <div class="total"><span>Total</span><strong id="bag-total">$0</strong></div>
      <button class="primary wide" id="checkout-button">Checkout</button>
    </div>
  </aside>

  <div class="modal hidden" id="checkout">
    <div class="sheet">
      <h2>Checkout</h2>
      <p class="muted">Demo store: connect your real checkout (Shopify, Stripe, etc.) here.</p>
      <div id="checkout-items"></div>
      <div class="total"><span>Total</span><strong id="checkout-total">$0</strong></div>
      <button class="primary wide" id="close-checkout">Done</button>
    </div>
  </div>

  <script src="/vendor/elevenlabs.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
